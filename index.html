<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>

<body>
<main>
  
  <div class="card">

    <!-- profile section -->
    <div class="profile">
      <img class="pic" src="./assets/images/avatar-jessica.jpeg" alt="">
      <h2 class="name">Jessica Randall</h2>
      <p class="location">London, United Kingdom</p>
      <p class="infomation">"Front-end developer and avid reader."</p>
    </div>

    <!-- link bars -->
    <nav>
      <a class="link" href="#">GitHub</a>
      <a class="link" href="#">Frontend Mentor</a>
      <a class="link" href="#">LinkedIn</a>
      <a class="link" href="#">Twitter</a>
      <a class="link" href="#">Instagram</a>
    </nav>

  </div>
</main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/EBrown2124">Eric Brown Jr</a>.
  </footer>
</body>
</html>
